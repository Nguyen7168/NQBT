camera:
  serial: null
  exposure_us: 8000
  gain: 0
  pixel_format: "Mono8"

window:
  x: 0
  y: 0
  width: 1400
  height: 900

plc:
  protocol: "ASCII_TCP"
  ip: "192.168.0.10"
  port: 8501
  addr:
    busy: "R1000"
    done: "R1001"
    error: "R1002"
    ready: "R1003"
    run: "R1004"
    trigger: "M200"
    ack: "M201"
    result_bits_start_word: "R1100"
    model_select_word: "DM1530"
    model_current_word: "DM1524"
    sample_trigger: "MR87900"
    mode_request_word: "DM1533"
    mode_current_word: "DM1525"
    mirror_result_word: "EM1332"
  log_raw_response: false
  trigger_poll_interval_ms: 50
  trigger_min_interval_ms: 100
  trigger_high_stable_ms: 80
  trigger_low_stable_ms: 80
  trigger_cooldown_ms: 300
  enable_plc_trigger: true
  model_poll_interval_ms: 200
  model_stable_ms: 200
  sample_trigger_poll_interval_ms: 50
  timeouts:
    connect_ms: 3000
    response_ms: 1000
    cycle_ms: 5000
    ack_clear_ms: 2000

models:
  anomaly:
    path: "models/anomaly.onnx"
    provider: "cuda"
    threshold: 0.15
    input_size: 256
  yolo:
    enabled: false
    path: "models/yolo.engine"
    conf_thres: 0.25
    iou_thres: 0.45
  active_recipe_code: 1
  glass_recipes:
    - code: 1
      path: "models/ITEM_A.pth"
      name: "ITEM_A"
      glass_threshold: 0.5
    - code: 2
      path: "models/ITEM_B.pth"
      name: "ITEM_B"
      glass_threshold: 0.5

io:
  save_images: true
  output_dir: "runs/latest"
  raw_dir: "runs/raw"
  crops_dir: "runs/crops"
  filename_pattern: "{ts}_{model}_{idx:02d}_{cls}.png"
  save_crops: false

layout:
  count: 28
  order: "row_major"
  rows: 4
  cols: 7
  patch_padding: 10
  circle_min_radius: 250
  circle_max_radius: 270
  circle_radius_expand: 0
  circle_erode_iter: 0
  circle_dilate_iter: 0
  circle_blur_kernel: 5
  circle_threshold: 50
  circle_use_otsu: false
  circle_invert: false
  ws_scale: 0.5
  ws_dist_ratio: 0.4
  ws_open_ksize: 3
  ws_open_iter: 1
  ws_bg_dilate_iter: 2
  ws_dist_mask_size: 5
  ws_min_area_px: 2000
  ws_max_contour_pts: 800


sample_image_root: "samples"
mirror_blur_kernel: 3
mirror_canny_threshold1: 222
mirror_canny_threshold2: 100
mirror_min_contour_area: 5000
mirror_diameter_min: 100
mirror_diameter_max: 1000
