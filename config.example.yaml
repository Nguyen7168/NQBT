app_title: "Bearing Inspection"
timing_log_enabled: false

camera:
  serial: ""
  exposure_us: 8000
  gain: 0
  pixel_format: "Mono8"
  reconnect_enabled: true
  reconnect_interval_ms: 2000
  reconnect_backoff_multiplier: 1.5
  reconnect_max_interval_ms: 10000
  reconnect_fail_streak_threshold: 3
  reconnect_recover_stable_success_count: 2

window:
  x: 0
  y: 0
  width: 1400
  height: 900

inference_service:
  enabled: false
  host: "127.0.0.1"
  port: 8765
  timeout_ms: 30000

plc:
  protocol: "ASCII_TCP"
  ip: "192.168.0.10"
  port: 8501
  addr:
    busy: "R1000"
    done: "R1001"
    error: "R1002"
    ready: "R1003"
    run: "R1004"
    trigger: "M200"
    ack: "M201"
    result_bits_start_word: "R1100"
    model_select_word: "DM1530"
    model_current_word: "DM1524"
    sample_trigger: "MR87900"
    mode_request_word: "DM1533"
    mode_current_word: "DM1525"
    mirror_result_word: "EM1332"
    detected_count_word: "DM1536"
  log_raw_request: false
  log_raw_response: false
  trigger_poll_interval_ms: 50
  trigger_min_interval_ms: 100
  trigger_high_stable_ms: 80
  trigger_low_stable_ms: 80
  trigger_cooldown_ms: 300
  enable_plc_trigger: true
  model_poll_interval_ms: 200
  model_stable_ms: 200
  sample_trigger_poll_interval_ms: 50
  poll_error_backoff_ms: 1000
  reconnect_enabled: true
  reconnect_interval_ms: 3000
  reconnect_backoff_multiplier: 1.5
  reconnect_max_interval_ms: 30000
  reconnect_consecutive_fail_to_degraded: 2
  reconnect_recover_stable_success_count: 2
  reconnect_switch_to_mock_on_startup_fail: true
  reconnect_keep_mock_until_real_stable: true
  reconnect_allow_plc_trigger_in_mock: false
  done_hold_ms: 0
  timeouts:
    connect_ms: 3000
    response_ms: 1000
    cycle_ms: 5000
    ack_clear_ms: 2000

models:
  anomaly:
    path: "models/anomaly.onnx"
    provider: "cuda"
    threshold: 0.15
    input_size: 256
  yolo:
    enabled: false
    path: "models/yolo.engine"
    conf_thres: 0.25
    iou_thres: 0.45
  active_recipe_code: 1
  glass_recipes:
    - code: 1
      path: "models/ITEM_A.pth"
      name: "ITEM_A"
      glass_threshold: 0.5
    - code: 2
      path: "models/ITEM_B.pth"
      name: "ITEM_B"
      glass_threshold: 0.5

io:
  save_images: true
  output_dir: "runs/latest"
  raw_dir: "runs/raw"
  crops_dir: "runs/crops"
  filename_pattern: "{ts}_{model}_{idx:02d}_{cls}.png"
  save_crops: false

layout:
  count: 28
  order: "row_major"
  rows: 4
  cols: 7
  patch_padding: 10
  circle_min_radius: 250
  circle_max_radius: 270
  circle_radius_expand: 0
  circle_erode_iter: 0
  circle_dilate_iter: 0
  circle_blur_kernel: 5
  circle_threshold: 50
  circle_use_otsu: false
  circle_invert: false
  ws_scale: 0.5
  ws_dist_ratio: 0.4
  ws_open_ksize: 3
  ws_open_iter: 1
  ws_bg_dilate_iter: 2
  ws_dist_mask_size: 5
  ws_min_area_px: 2000
  ws_max_contour_pts: 800
  overlay_index_text_mode: "auto"  # auto|fixed
  overlay_index_font_scale: 1.0      # used when mode=fixed
  overlay_index_thickness: 2         # used when mode=fixed
  overlay_index_outline_extra: 2     # outline thickness = thickness + extra
  overlay_index_min_scale: 0.5       # used when mode=auto
  overlay_index_max_scale: 1.2       # used when mode=auto
  overlay_index_scale_divisor: 180.0 # used when mode=auto


sample_image_root: "samples"
mirror:
  target_ring: 10
  bright_thresh: 160
  crop_ratio: 0.44
  band_half_width: 2
  profile_smooth: 9
  min_peak_value: 6.0
  min_peak_distance: 28
  max_ring_ratio: 0.48
  center_refine: 10
  diameter_min: 100
  diameter_max: 1000
