app_title: "CAMERA 1"
timing_log_enabled: false

camera:
  serial: "40736983"
  exposure_us: 8000
  gain: 0
  pixel_format: "BayerRG8"
  reverse_x: true
  reverse_y: true

window:
  x: 640
  y: 0
  width: 640
  height: 980

ui:
  show_notch_column: true

inference_service:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  timeout_ms: 30000

measurement:
  mm_per_pixel: 0.01

plc:
  protocol: "ASCII_TCP"
  ip: "192.168.1.1"
  port: 8501
  addr:
    busy: "DM1522"
    done: "DM1523"
    error: "DM1710"
    ready: "DM1521"
    run: "DM1520"
    trigger: "MR62500"
    ack: "DM1544"
    result_bits_start_word: "DM30"
    model_select_word: "DM1530"
    model_current_word: "DM1524"
    sample_trigger: "MR87900"
    mode_request_word: "DM1533"
    mode_current_word: "DM1525"
    mirror_result_word: "EM1332"
    detected_count_word: "DM1536"
    camera_capture_done: "EM7951"
  log_raw_request: false
  log_raw_response: false
  trigger_poll_interval_ms: 10
  trigger_min_interval_ms: 100
  trigger_high_stable_ms: 40
  trigger_low_stable_ms: 80
  trigger_cooldown_ms: 300
  enable_plc_trigger: true
  model_poll_interval_ms: 200
  model_stable_ms: 200
  sample_trigger_poll_interval_ms: 50
  poll_error_backoff_ms: 1000
  done_hold_ms: 50
  timeouts:
    connect_ms: 3000
    response_ms: 1000
    cycle_ms: 5000
    ack_clear_ms: 2000

models:
  algo: "INP"  # INP or GLASS
  inp:
    path: app/models/anomaly.onnx
    provider: "cuda"
    input_size: 448
    inp_mode: "legacy_script"  # "default" or "legacy_script"
    inp_threshold: 0.15
    inp_blur_kernel: 5
    inp_blur_sigma: 4.0
    inp_max_ratio: 0.02
    inp_bin_thresh: 0.2
    diameter_min_mm: 4.8
    diameter_max_mm: 5.4
  glass:
    path: "app/models/23-233HA-E.pth"
    provider: "cuda"
    input_size: 288
    glass_threshold: 0.99
    glass_batch: 8
    glass_blur_kernel: 33
    glass_blur_sigma: 4.0
    glass_norm_eps: 1.0e-8
    glass_bin_thresh: 0.8
    diameter_min_mm: 4.8
    diameter_max_mm: 5.4
  yolo:
    enabled: false
    path: "models/yolo.engine"
    conf_thres: 0.25
    iou_thres: 0.45
    crop_enabled: true
    crop_path: "app/models/crop_yolo/23-233HA-E/best.pt"
    crop_conf_thres: 0.4
    crop_iou_thres: 0.7
    crop_imgsz: 960
    crop_device: "cuda:0"
    crop_classes: null
  notch_yolo:
    enabled: true
    path: "app/models/notch_yolo/best.pt"
    conf_thres: 0.6
    iou_thres: 0.45
    imgsz: 480
    device: "cuda:0"
    classes: [0]
  active_recipe_code: 1
  recipes:
    - code: 1
      inp_model_path: "app/models/anomaly.onnx"
      glass_model_path: "app/models/23-233HA-E.pth"
      name: "23-233HA-E"
      threshold: 0.055
      crop_yolo_path: "app/models/crop_yolo/23-233HA-E/best.pt"
      diameter_min_mm: 4.8
      diameter_max_mm: 5.4
      notch_check_enabled: true
      notch_min_count: 2
      notch_max_count: 3
      notch_yolo_path: null
    - code: 2
      inp_model_path: "app/models/anomaly.onnx"
      glass_model_path: "app/models/gls_epoch_124_loss_0_1330_271img.pth"
      name: "ITEM_2"
      threshold: 0.5
      crop_yolo_path: "app/models/crop_yolo/ITEM_2/best.pt"
      diameter_min_mm: 4.8
      diameter_max_mm: 5.4
      notch_check_enabled: false
      notch_min_count: 2
      notch_max_count: 7
      notch_yolo_path: null

io:
  save_images: true
  save_only_ng: true
  output_dir: "runs/cam1/latest"
  raw_dir: "runs/cam1/raw"
  crops_dir: "runs/cam1/crops"
  filename_pattern: "{ts}_{model}_{idx:02d}_{cls}.png"
  save_heatmap: false
  save_binary: false
  save_crops: false
  save_ng_crops_only: true

layout:
  count: 28
  order: "row_major"
  rows: 4
  cols: 7
  patch_padding: 10
  crop_method: "yolo_circle"  # circle | yolo_circle
  circle_min_radius: 240
  circle_max_radius: 270
  circle_radius_expand: 0
  circle_erode_iter: 0
  circle_dilate_iter: 0
  circle_blur_kernel: 7
  circle_threshold: 75
  circle_use_otsu: false
  circle_invert: false
  yolo_circle_radius_expand: 6
  yolo_crop_fallback_to_circle: true
  ws_scale: 0.4
  ws_dist_ratio: 0.55
  ws_open_ksize: 7
  ws_open_iter: 0
  ws_bg_dilate_iter: 2
  ws_dist_mask_size: 5
  ws_min_area_px: 2000
  ws_max_contour_pts: 800
  overlay_index_text_mode: "fixed"  # auto|fixed
  overlay_index_font_scale: 2.0      # used when mode=fixed
  overlay_index_thickness: 2         # used when mode=fixed
  overlay_index_outline_extra: 2     # outline thickness = thickness + extra
  overlay_index_min_scale: 0.5       # used when mode=auto
  overlay_index_max_scale: 1.2       # used when mode=auto
  overlay_index_scale_divisor: 180.0 # used when mode=auto


custom_dialog:
  limits:
    - feature: "Iris 1"
      lower: 245
      upper: 255
    - feature: "Iris 2"
      lower: 245
      upper: 255
    - feature: "Iris 3"
      lower: 245
      upper: 255
    - feature: "Iris 4"
      lower: 245
      upper: 255
    - feature: "Focus 1"
      lower: 45
      upper: null
    - feature: "Focus 2"
      lower: 45
      upper: null
    - feature: "Focus 3"
      lower: 45
      upper: null
    - feature: "Focus 4"
      lower: 45
      upper: null
    - feature: "Center X"
      lower: 2028
      upper: 2068
    - feature: "Center Y"
      lower: 1490
      upper: 1510
    - feature: "Circle Radius"
      lower: 950
      upper: 970

sample_image_root: "samples"
mirror:
  target_ring: 10
  bright_thresh: 160
  crop_ratio: 0.44
  band_half_width: 2
  profile_smooth: 9
  min_peak_value: 6.0
  min_peak_distance: 28
  max_ring_ratio: 0.48
  center_refine: 10
  diameter_min: 900
  diameter_max: 1000
